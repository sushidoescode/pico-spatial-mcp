name: gates
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  picocli-windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (Windows pico-cli shim lane)
        run: npm run build
      - name: pico-cli + battery CLI + smoke wrapper selection (no native build_and_run execution)
        run: npm run test:picocli-win

  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: ImageMagick (the eye's pixel assists)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
      - name: Build (tsc)
        run: npm run build
      # The Linux-assigned deterministic/headless tiers. The complete 46-invocation battery also
      # includes one Windows-assigned and two macOS-assigned native contracts; emulator/LOOK work
      # cannot run in this CI job.
      - name: Smoke (every tool registers + responds)
        run: npm run smoke
        env:
          SMOKE_SDK_OPTIONAL: "1"
      - name: Lint fixtures + keep-going battery-runner contract
        run: npm run test:lint
      - name: Vault fixtures (agent-vault parser + symbol check; real-vault asserts skip in CI)
        run: npm run test:vault
      - name: Vault drift engine (fixture pair, five drift classes + hints)
        run: npm run test:vaultdiff
      - name: Semantic placement (label-anchored resolution + compile hook)
        run: npm run test:semantic
      - name: Referring expressions (skips without the local scan)
        run: npm run test:referring
      - name: Twelve Doors (surface facade + inner orchestration)
        run: npm run test:doors
      - name: Preflight env doctor (every failure carries the exact fix)
        run: npm run test:preflight
      - name: Project generator (packaged skeleton emits a complete rebrandable project)
        run: npm run test:projectgen
      - name: Unity lane generator (packaged skeleton + scaffold contract; no Unity needed)
        run: npm run test:unitygen
      - name: Surface placement (the six silent MR-seating traps stay closed)
        run: npm run test:surfaceplace
      - name: Model measurement (bbox + baseLift are measured, never hand-typed)
        run: npm run test:modelmeasure
      - name: Docs/metadata sync (versions, tool counts, links, manifests)
        run: npm run test:docsmeta
      - name: pico-cli probe + perf trace lane
        run: npm run test:picocli
      - name: Swan identity gate + parity closure
        run: npm run test:swan
      - name: place_model_on_surface orchestrator
        run: npm run test:placeonsurface
      - name: Menu actions + static shapes + panel show/hide codegen truth
        run: npm run test:menuactions
      - name: Name-aware procedural provisioning (matcher always runs; bake self-skips without an SDK)
        run: npm run test:provision
      - name: Mouse bridge (pidfile lifecycle + tool surface)
        run: npm run test:bridge
      - name: Claims page (generated from the ledger, escaped, filterable)
        run: npm run test:claims
      - name: SpatialBench headless tier (pipeline briefs score 3/3; explicit external routes skip 0/0)
        run: npm run test:bench
      - name: External brief routes (CameraPeek cannot become a generic generated HUD)
        run: npm run test:briefroute
      - name: Scaffold archetypes (brief steers plan_app_spec toward display/game/data-panel)
        run: npm run test:archetype
      - name: Affordance solver (free space, honest no-fit, compiler on-route)
        run: npm run test:affordance
      - name: Occupancy from geometry (unlabeled obstacles block placement)
        run: npm run test:occupancy
      - name: Virtual camera (deterministic world render + frame mapping)
        run: npm run test:vcam
      - name: Virtual camera transport (deterministic cards + fake producer lifecycle)
        run: npm run test:vcamtransport
      - name: Virtual camera boundary (fail-closed source-readback report + orchestration)
        run: npm run test:vcamboundary
      - name: Virtual camera reader (read-only CMIO probe source audit; no camera on Linux)
        run: npm run test:vcamreader
      - name: Virtual camera throughput (cadence + lower-bound latency; confounded rather than wrong)
        run: npm run test:vcamthroughput
      - name: Virtual camera materializer (frames before manifest, array-indexed, fail-closed)
        run: npm run test:vcammaterialize
      - name: Distributable tarball (installs clean and runs with no repo present)
        run: npm run test:tarball
      - name: Emulator restart argv + lifecycle (fully faked; no device access)
        run: npm run test:emulator-restart
      - name: Live copilot (bridge-line protocol + scene diff)
        run: npm run test:copilot
      - name: Ledger fixtures (over-claims structurally impossible)
        run: npm run test:ledger
      - name: Eye calibration
        run: npm run test:eye
      - name: Asset gate
        run: npm run test:assetgate
      - name: World-env
        run: npm run test:worldenv
      - name: Adoption safety (project configuration + build truth)
        run: npm run test:adoption-safety
      - name: SpatialUI adoption (containers, gestures, and source-grounded components)
        run: npm run test:spatialui-adoption
      - name: Distribution adoption (host manifests, bootstrap, knowledge graph, emulator acquisition)
        run: npm run test:distribution-adoption
      - name: Knowledge child lifecycle (bounded retirement + managed publication guards)
        run: npm run test:knowledge-lifecycle
      - name: Sample conformance (our codegen vs PICO's eight official Spatial SDK samples)
        run: npm run test:conformance

  vcam-native:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Virtual camera native writer (strict compile + pre-CMIO manifest rejection)
        run: npm run test:vcamtransport-native
      - name: Virtual camera native reader (strict compile + signal/stop lifetime + parser rejection)
        run: npm run test:vcamreader-native
